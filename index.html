<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>復元せよ 土器・土偶・埴輪</title>
<meta name="description" content="こなごなになった縄文土器を3Dで組み立てて復元するパズルゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- アプリ版（Android）用：広告の設定とバージョン（Web 版では広告は何もしない） -->
<script src="js/ads-config.js"></script>
<script src="js/build-info.js"></script>
<script src="js/ads.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<!-- タイトル（スタート前は完成した姿を見せる） -->
<section id="title" class="panel">
  <header class="logo">
    <h1 data-i18n="logo.title">復元せよ</h1>
    <p class="sub" data-i18n="logo.sub">土器・土偶・埴輪</p>
  </header>
  <div class="title-bottom">
    <div id="artifact-list" class="artifact-list"></div>
    <div id="artifact-info" class="artifact-info"></div>
    <button id="stage-toggle" class="stage-toggle" type="button" aria-expanded="false">ステージを選ぶ ▾</button>
    <button id="start-btn" class="primary" disabled>読み込み中…</button>
    <div class="title-sub-actions">
      <button id="howto-btn" type="button" data-i18n="title.howto">あそびかた</button>
    </div>
    <p class="tip" data-i18n="title.tip">ドラッグ・フリックで回して、じっくり観察しよう</p>
    <p class="legal"><span id="build-info"></span><a href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="title.privacy" data-i18n-href="title.privacyUrl">プライバシーポリシー</a><span id="ad-privacy" hidden>｜<a href="#" id="ad-privacy-link" data-i18n="title.adSettings">広告の設定</a></span>｜<a href="#" id="lang-btn" data-i18n="title.lang">English</a></p>
  </div>
</section>

<!-- プレイ中の表示 -->
<section id="hud" hidden>
  <div class="hud-top">
    <div class="hud-name"><span id="hud-kind"></span><strong id="hud-title"></strong></div>
    <div class="hud-stats">
      <span class="stat"><em data-i18n="hud.pieces">ピース</em><b id="hud-count">0 / 0</b></span>
      <span class="stat"><em data-i18n="hud.time">時間</em><b id="hud-time">0:00</b></span>
    </div>
  </div>
  <div class="hud-buttons">
    <button id="btn-hint" title="次にはめるピースを光らせる" data-i18n="hud.hint" data-i18n-title="hud.hintTitle">ヒント</button>
    <button id="btn-ghost" title="完成形のガイドを表示" data-i18n="hud.guide" data-i18n-title="hud.guideTitle">ガイド</button>
    <button id="btn-view" title="視点をもとに戻す" data-i18n="hud.view" data-i18n-title="hud.viewTitle">視点</button>
    <button id="btn-bgm" title="BGM">BGM ON</button>
    <button id="btn-sound" title="すべての音" data-i18n-title="hud.soundTitle">音 ON</button>
    <button id="btn-auto" title="広告を見ると、次のピースを自動ではめます" data-i18n-title="hud.autoTitle" hidden>おまかせ</button>
    <button id="btn-menu" title="一時停止" data-i18n="hud.pause" data-i18n-title="hud.pause">ポーズ</button>
  </div>
  <p id="hud-help" class="hud-help" data-i18n="hud.help">ピースをドラッグして正しい位置に近づけると<b>ピタッ</b>とはまります。<b>底や足のピース</b>から組み上げよう。<br>何もないところをフリックすると回転できます。</p>
</section>

<div id="toast" class="toast" hidden></div>

<!-- あそびかた -->
<section id="howto" class="modal" hidden>
  <div class="card">
   <div class="card-scroll">
    <p class="result-label" data-i18n="howto.label">あそびかた</p>
    <h2 data-i18n="howto.title">こなごなの出土品を復元しよう</h2>
    <div class="desc">
      <div data-i18n="howto.body"></div>
      <p id="howto-auto" hidden data-i18n="howto.auto"></p>
      <p data-i18n="howto.unlock"></p>
    </div>
   </div>
    <div class="result-actions">
      <button id="howto-close" class="primary" data-i18n="howto.close">タイトルにもどる</button>
    </div>
  </div>
</section>

<!-- ポーズ -->
<section id="pause" class="modal" hidden>
  <div class="card pause-card">
    <p class="result-label" data-i18n="pause.label">ポーズ中</p>
    <h2 id="pause-title"></h2>
    <div class="result-actions">
      <button id="pause-resume" class="primary" data-i18n="pause.resume">つづける</button>
      <button id="pause-title-btn" data-i18n="pause.title">タイトルにもどる</button>
    </div>
  </div>
</section>

<!-- 完成 -->
<section id="result" class="modal" hidden>
  <div class="card">
   <div class="card-scroll">
    <p class="result-label" data-i18n="result.label">復元完了</p>
    <h2 id="result-title"></h2>
    <p id="result-era" class="era"></p>
    <div class="result-stats">
      <div><em data-i18n="result.time">タイム</em><b id="result-time"></b></div>
      <div><em data-i18n="result.pieces">ピース</em><b id="result-pieces"></b></div>
      <div><em data-i18n="result.hints">ヒント</em><b id="result-hints"></b></div>
      <div id="result-autos-box" hidden><em data-i18n="result.autos">おまかせ</em><b id="result-autos"></b></div>
    </div>
    <div id="result-desc" class="desc"></div>
   </div>
    <div class="share" aria-label="結果をシェア">
      <span class="share-label" data-i18n="share.label">シェア</span>
      <button id="share-x" class="share-btn" type="button" title="Xでシェア" data-i18n-title="share.x">X</button>
      <button id="share-line" class="share-btn line" type="button" title="LINEで送る" data-i18n-title="share.line">LINE</button>
      <button id="share-fb" class="share-btn fb" type="button" title="Facebookでシェア" data-i18n-title="share.fb">f</button>
      <button id="share-copy" class="share-btn" type="button" title="リンクをコピー" data-i18n="share.copy" data-i18n-title="share.copy">リンクをコピー</button>
    </div>
    <div class="result-actions">
      <button id="btn-next" class="primary">次のステージへ</button>
      <button id="btn-again" data-i18n="result.again">もう一度</button>
      <button id="btn-view-pot" data-i18n="result.view">ながめる</button>
      <button id="btn-title" data-i18n="result.title">タイトルへ</button>
    </div>
  </div>
</section>

<div id="loading" class="loading">
  <div class="loading-inner">
    <div class="spinner"></div>
    <p data-i18n="loading.text">出土品を準備しています…</p>
    <div class="bar"><span id="load-bar"></span></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
